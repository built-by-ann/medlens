[pytest]
testpaths = tests
# Without this, `app` is only importable when pytest happens to be invoked
# as `python -m pytest` (which prepends the cwd to sys.path as a side
# effect of `python -m` itself) - the plain `pytest` command documented in
# docs/testing.md and run by .github/workflows/backend.yml has no such
# side effect, since tests/ has no __init__.py for pytest's own rootdir
# insertion to walk past. Setting pythonpath explicitly makes `app`
# resolvable the same way regardless of which of the two a developer (or
# CI) happens to run.
pythonpath = .
