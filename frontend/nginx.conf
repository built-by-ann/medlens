# Issue #189: plain HTTP only ever does two things now - serves Let's
# Encrypt's ACME HTTP-01 challenge (needed for certbot to issue *and*
# renew a certificate, so this can never simply redirect everything) and
# redirects every other request to HTTPS. No /api/ proxying or SPA
# serving happens here at all - see the 443 server block below for that.
server {
  listen 80;
  server_name _;

  # certbot (infra/docker-compose.yml's `certbot` service) writes its
  # HTTP-01 challenge files here; this container mounts the same volume
  # read-only. Must stay reachable over plain HTTP - Let's Encrypt's own
  # validator connects on port 80, never 443, to prove domain control.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 308, not 301: preserves the request method and body, which 301
  # technically leaves to the client's discretion and some HTTP libraries
  # (though not most modern browsers) get wrong for anything other than
  # GET. $request_uri (not $uri) carries the query string through too.
  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # __DOMAIN__ is substituted at image build time (frontend/Dockerfile's
  # DOMAIN build arg - the same "baked in at build time, override with
  # --build-arg" pattern already established for VITE_API_BASE_URL, see
  # docs/design-decisions.md Decision 18) - a plain sed substitution, not
  # nginx's own $variable syntax, so it can't collide with $host/$scheme/
  # etc. used elsewhere in this file. /live/__DOMAIN__/ matches certbot's
  # own fixed directory convention inside the shared certbot_certs volume
  # (infra/docker-compose.yml) - not a path this file invented. Local
  # development and this repository's own testing never populate this
  # with a real certificate; ensure-dummy-cert.sh (frontend/Dockerfile)
  # generates a short-lived self-signed one at this same path at container
  # start instead, so it's never actually empty by the time nginx reads
  # it. See docs/deployment.md's HTTPS section for how a real certificate
  # gets here in production.
  ssl_certificate /etc/nginx/ssl/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/__DOMAIN__/privkey.pem;

  # TLS 1.2 and 1.3 only - both still have no known practical break, and
  # every browser released in the last several years supports 1.3. 1.0/1.1
  # are deprecated across the industry (removed from major browsers
  # already) and shouldn't be offered even for compatibility.
  ssl_protocols TLSv1.2 TLSv1.3;
  # Mozilla's "Intermediate" cipher list - the standard reference
  # configuration for "modern but not cutting-edge-only" TLS, wide browser
  # compatibility without including any cipher with a known practical
  # weakness. TLS 1.3's own ciphers aren't listed here at all - they're
  # fixed by the protocol itself and not configurable through this
  # directive.
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  # Avoids a full TLS handshake (and its round trips) on every request
  # from the same client - purely a performance setting, not a security
  # one; the cipher/protocol restrictions above are unaffected by it.
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # max-age is ~6 months, deliberately conservative - no includeSubDomains
  # (nothing else is known to run on a subdomain of this one, and adding
  # it later is far easier than a browser having already cached and
  # enforced it against something that turns out not to support HTTPS)
  # and no preload (that list is effectively permanent once submitted).
  # "always" - Strict-Transport-Security is only meaningful on a response
  # that was itself served over HTTPS, and this directive would otherwise
  # be silently skipped on nginx's own non-2xx/3xx error responses (e.g. a
  # 502 if the backend is briefly unreachable), which is exactly the kind
  # of response a client still needs this header on.
  add_header Strict-Transport-Security "max-age=15768000" always;

  # Issue #190: nginx's own default (1m) is smaller than a real multi-page
  # clinical PDF upload that already works today when the browser talks to
  # the backend directly - without raising this, routing uploads through
  # this proxy would silently start rejecting files that upload fine now.
  # The backend itself imposes no size limit of its own to match.
  client_max_body_size 25m;

  # Docker's embedded DNS server, present on every Compose network - used
  # below so `backend`'s address is resolved per-request (subject to this
  # 30s cache) rather than once at nginx startup. This matters because
  # `backend` has its own `restart: unless-stopped` (infra/docker-compose.yml)
  # and can come back with a new container IP after a crash, and because
  # infra/docker-compose.yml's own documented update flow (see
  # docs/deployment.md) rebuilds and recreates *only* the backend
  # container on a backend-only change, leaving this container untouched -
  # a bare `proxy_pass http://backend:8000/` would cache the pre-update IP
  # for the rest of this container's life, breaking every /api/ request
  # until this container was also restarted.
  resolver 127.0.0.11 valid=30s;

  # Issue #190: the browser only ever talks to this one origin - every
  # backend endpoint is reached through this one prefix, never directly on
  # its own port (see docs/design-decisions.md, Decision 23, for how
  # client_ip logging still works correctly through this proxy).
  location /api/ {
    # set before rewrite: both are rewrite-phase directives, but `break`
    # stops all further rewrite-phase processing in this block, including
    # any `set` that comes after it - `set` has to run first or
    # $backend_upstream is still unset when proxy_pass reads it below
    # (confirmed the hard way: an "using uninitialized ... variable"
    # warning and a 500 with the directives in the other order).
    set $backend_upstream backend:8000;
    # rewrite ... break, not a URI on proxy_pass: proxy_pass only performs
    # its usual automatic prefix-stripping when its target is a static
    # string - once it's a variable (required for the dynamic $resolver
    # lookup above), nginx forwards the request URI unchanged instead, so
    # the prefix has to be stripped explicitly first.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;

    # Required for keepalive to the upstream, and a prerequisite should
    # this application ever add a WebSocket endpoint (audited for Issue
    # #190: nothing in this codebase uses WebSockets today, so the
    # Upgrade/Connection header pair a real WebSocket proxy also needs is
    # deliberately omitted - add `proxy_set_header Upgrade $http_upgrade;`
    # and `proxy_set_header Connection "upgrade";` alongside this if that
    # ever changes).
    proxy_http_version 1.1;

    # Preserves the real client IP and original request details for the
    # backend - without these, every request the backend sees (and every
    # client_ip it logs, see app/core/logging_config.py) would show this
    # container's own Docker-network address instead. Paired with
    # backend/Dockerfile's `--forwarded-allow-ips` flag, which is what
    # makes uvicorn actually trust and read these headers rather than
    # ignoring them. X-Forwarded-Proto is "https" here unconditionally -
    # $scheme reflects this server block, and plain-HTTP requests never
    # reach this far (the port 80 server block above redirects them
    # before they ever hit /api/).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router uses client-side routing, so a direct request or refresh
  # on a route like /patients/5 has no matching file on disk - fall back to
  # index.html and let the app's own router handle it, instead of nginx's
  # default 404.
  location / {
    try_files $uri /index.html;
  }
}
