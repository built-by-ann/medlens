server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router uses client-side routing, so a direct request or refresh
  # on a route like /patients/5 has no matching file on disk - fall back to
  # index.html and let the app's own router handle it, instead of nginx's
  # default 404.
  location / {
    try_files $uri /index.html;
  }
}
