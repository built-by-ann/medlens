name: Frontend CI

# Runs on pushes and PRs that touch the frontend (or this workflow file
# itself), targeting the repo's two long-lived branches - matches how the
# rest of this repo already branches (feature/* -> develop -> main).
# Backend-only or docs-only changes don't trigger this at all.
on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  quality:
    name: Lint, typecheck, format, test, build
    runs-on: ubuntu-latest

    # Every step below runs with frontend/ as its cwd, so commands read the
    # same way they do when a developer runs them locally (see
    # docs/frontend.md's "Quality pipeline" section) - no repeated `cd`.
    defaults:
      run:
        working-directory: frontend

    # src/lib/env.ts throws at module-load time if VITE_API_BASE_URL isn't
    # set - required so a provider always gets a clear error instead of a
    # silently broken API client, but it means every test file that
    # (transitively) imports the API client needs it defined too. Locally
    # that comes from frontend/.env (gitignored, per .env.example); CI has
    # no such file, so it's set here instead. Not a secret - tests never
    # make a real network call, so any well-formed URL works, and this
    # matches .env.example's own placeholder value.
    env:
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches this repo's local dev environment (no engines field or
          # .nvmrc exists to read instead - Vite 8/ESLint 10/Vitest 4 all
          # require at least Node 20.19, and Node 20 is what's actually
          # been used to develop and verify this project).
          node-version: "20"
          # actions/setup-node's built-in npm cache, keyed off the lockfile
          # hash - no separate cache action needed.
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # A lockfile already exists and is committed, so `npm ci` (exact,
      # reproducible install) is correct here, not `npm install`.
      - name: Install dependencies
        run: npm ci

      # Every check below is exactly the package.json script a developer
      # runs locally (see Issue #53 / docs/frontend.md) - never the
      # underlying tool invoked directly - so there is exactly one place
      # (package.json) that defines what each check does. A step's failure
      # stops the job here by default, so lint/typecheck/format/test/build
      # failures all fail this workflow.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Issue #56: the final step of this job, not a separate workflow or
      # job - a change that passes every check above but produces a
      # Dockerfile that can't actually be built would otherwise only be
      # caught by hand, at deploy time. `docker build` alone (no push, no
      # registry login, no compose) is enough to prove the production
      # image still builds. VITE_API_BASE_URL is passed explicitly as a
      # build arg (reusing the same job-level value the steps above
      # already use) because Vite inlines it into the built JS bundle at
      # build time - it isn't read from the process environment the way
      # the steps above read it, so it has to be threaded through
      # `--build-arg` rather than just being present in `env:` above. The
      # Dockerfile's own ARG default is this same value, so this flag is
      # for clarity/consistency with the rest of the job, not because the
      # build would fail without it.
      - name: Validate Docker image build
        run: docker build --build-arg VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} -t medlens-frontend:ci .
