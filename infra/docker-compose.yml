services:
  backend:
    build:
      context: ../backend
    ports:
      # 127.0.0.1, not a bare port publish (Issue #190): the browser now
      # only ever reaches this service through the frontend container's
      # nginx reverse proxy (frontend/nginx.conf), which reaches it over
      # the Docker network by service name, not through this published
      # port at all - published ports are only ever a host-to-container
      # path, never used for container-to-container traffic. This exists
      # purely so a developer on the host itself can still reach the API
      # directly (curl, Postman, `npm run dev`'s Vite dev server - see
      # docs/deployment.md), the same reasoning already applied to
      # postgres below.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # POSTGRES_PASSWORD is shared with the postgres service below - both
      # read the same variable so they can never drift out of sync.
      DATABASE_URL: postgresql://medlens_user:${POSTGRES_PASSWORD:-medlens_password}@postgres:5432/medlens_db
      # Settings.jwt_secret_key (app/core/config.py) is required with no
      # default. The placeholder below is fine for local development -
      # nothing here is a real secret, and every service is thrown away on
      # `docker compose down` - but a real deployment MUST override it with
      # a real secret via infra/.env (see infra/.env.example), never by
      # editing this file. See docs/deployment.md's "Environment Variables"
      # section.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-not-used-anywhere-real}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Settings.gemini_model (app/core/config.py) already defaults to
      # gemini-2.5-flash when this is unset, so the default below is
      # redundant with that - kept explicit anyway so a Gemini model
      # retirement (the incident this default was changed for) can be fixed
      # here, in infra/.env, without touching application code or rebuilding
      # any image - just a container restart.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Which AIProvider get_ai_summary_service() constructs (app/ai/
      # service.py) - "gemini" (the default), "openbiollm", or "medgemma".
      # Settings' own startup validation fails the container immediately,
      # with a clear error, if this is set to anything else.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      # Only required when AI_PROVIDER=openbiollm or AI_PROVIDER=medgemma
      # (both call Hugging Face's Inference Providers mechanism, and share
      # this one token) - see docs/deployment.md and docs/ai.md.
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      OPENBIOLLM_MODEL: ${OPENBIOLLM_MODEL:-aaditya/Llama3-OpenBioLLM-8B}
      MEDGEMMA_MODEL: ${MEDGEMMA_MODEL:-google/medgemma-27b-text-it}
      # development (the default) auto-allows any localhost/127.0.0.1
      # origin for CORS (see app/main.py's configure_cors) - relevant only
      # to `npm run dev`'s Vite dev server, which talks to this container
      # directly and cross-origin (see docs/deployment.md). Every request
      # that goes through the frontend container's nginx reverse proxy
      # (Issue #190) is same-origin and never triggers CORS at all, in
      # either environment, so there is no production equivalent of this
      # setting to configure - see docs/design-decisions.md, Decision 24.
      APP_ENV: ${APP_ENV:-development}
      # Issue #61: reported as-is by GET /health - purely informational,
      # never used to gate any behavior.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # Issue #59: root logger level - see docs/deployment.md's "Structured
      # Application Logging" section.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Issue #58: defaults to local-filesystem storage (inside this
      # container - lost on every recreate, see infra/.env.example), zero
      # extra configuration needed. Settings' own startup validation
      # (app/core/config.py) fails the container immediately, with a clear
      # error, if STORAGE_BACKEND=s3 is set here without AWS_REGION and
      # S3_BUCKET_NAME also set - never a silent misconfiguration.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Left unset by default even when STORAGE_BACKEND=s3 - the
      # recommended production setup is an IAM role attached to the EC2
      # instance, which needs neither (see docs/deployment.md's Security
      # section). Only set for local testing against a real bucket.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    healthcheck:
      # GET /health always returns HTTP 200, even when the database is
      # unreachable (see docs/api.md) - a plain "did the request succeed"
      # check would report healthy the whole time the app is actually
      # broken. This reads the response body and checks the field the
      # endpoint itself defines as the real signal, the same way a human
      # debugging it would.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request as u; d=json.loads(u.urlopen('http://localhost:8000/health').read()); exit(0 if d.get('status')=='ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        # Baked into the built JS bundle at image build time (see
        # frontend/Dockerfile) - a relative path (Issue #190), not an
        # absolute URL, since the browser now reaches the backend through
        # this same nginx container's own reverse proxy
        # (frontend/nginx.conf) rather than a separate host/port. This is
        # also why this same default now works unmodified for both local
        # Docker Compose use and a real deployment - unlike before, the
        # frontend image no longer needs to know the deployment's public
        # hostname at build time at all. Rebuild the image (`docker
        # compose build frontend`) after changing this - restarting the
        # container alone has no effect, since it's already baked in.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        # Issue #189: which certificate path nginx.conf is built to
        # expect (/etc/letsencrypt/live/$DOMAIN/... - certbot's own fixed
        # convention) - must match whatever domain the `certbot` service
        # below actually issues a certificate for, or nginx will look in
        # the wrong place inside the shared certbot_certs volume. Rebuild
        # (`docker compose build frontend`), not just restart, after
        # changing this - same reasoning as VITE_API_BASE_URL above.
        DOMAIN: ${DOMAIN:-medlenshealth.com}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # Issue #189: HTTPS - the port 80 server block (frontend/nginx.conf)
      # only redirects here and serves the ACME challenge now; everything
      # else (the SPA, /api/*) is served over this port.
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # Issue #189: certbot_certs is NOT read-only from this side, despite
      # certbot (below) being the one that writes the *real* certificate -
      # ensure-dummy-cert.sh (frontend/Dockerfile) also needs to write the
      # placeholder certificate here whenever a real one doesn't exist yet
      # (every local `docker compose up`, and a brand new production
      # instance before certbot's first run). Both are named volumes, not
      # bind mounts, so this works identically in local development and
      # production with no path to configure per environment.
      - certbot_certs:/etc/nginx/ssl
      # This one genuinely is read-only from here - nginx only ever reads
      # ACME challenge files certbot wrote, never creates them itself.
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    healthcheck:
      # https://127.0.0.1/, not http (Issue #189) - port 80 now only
      # redirects, so a plain HTTP check would still pass (a redirect
      # response is itself a sign of life), but checking 443 directly
      # verifies the thing users and /api/ traffic actually go through.
      # --no-check-certificate: this check only cares whether nginx is
      # responding, not whether the certificate is one a browser would
      # trust - in local development (and briefly, on a brand new
      # production instance before certbot's first run) it's the
      # self-signed placeholder ensure-dummy-cert.sh generates, which is
      # never going to validate against a real CA and isn't supposed to.
      # 127.0.0.1, not localhost: this image's nginx only listens on
      # IPv4, but the container's /etc/hosts resolves "localhost" to ::1
      # (IPv6) first, which wget then tries first and gets
      # connection-refused on - a real failure caught during
      # verification, not a hypothetical.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--no-check-certificate",
          "--spider",
          "https://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Still no depends_on: backend, even though this container's nginx now
    # reverse-proxies to it (Issue #190; see frontend/nginx.conf) - unlike
    # Issue #183's original reasoning (no reverse proxy existed yet, so
    # there was no dependency at all), nginx's use of Docker's DNS
    # resolver with a dynamic upstream means it starts successfully even
    # if `backend` doesn't exist yet, and self-heals /api/ once it does -
    # a static `proxy_pass http://backend:8000` would instead fail to
    # start entirely without this container waiting on backend first. See
    # frontend/nginx.conf's own comments and docs/design-decisions.md,
    # Decision 24, for the full reasoning. Waiting here anyway would
    # needlessly delay this container's own (independent) readiness for
    # serving the SPA - see Issue #183 for why that specifically matters.

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medlens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlens_password}
      POSTGRES_DB: medlens_db
    ports:
      # Bound to localhost only, like backend above and unlike frontend -
      # the database has no reason to be reachable from outside the host
      # at all (nothing outside this compose file ever needs to reach it
      # directly), so it stays unreachable even if a security group is
      # ever misconfigured to allow it. Still reachable from the host
      # itself (e.g. `psql -h localhost`, or an SSH tunnel from a laptop)
      # for debugging. See docs/deployment.md's Security section.
      - "127.0.0.1:5432:5432"
    volumes:
      - medlens_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlens_user -d medlens_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      # On a fresh volume, postgres's own entrypoint runs initdb, then
      # briefly starts and stops the server once as part of that process
      # before starting it for real (standard postgres:16 image behavior)
      # - pg_isready fails (connection refused) during that window, which
      # is expected, not a real problem. Without start_period those
      # expected early failures count toward retries above like any other
      # failure; matches backend's/frontend's own start_period above.
      start_period: 10s

  # Issue #189: `profiles` (not started by a plain `docker compose up` or
  # `up -d --build`, including this issue's own validation run of those
  # exact commands - `docker compose run` still works regardless of
  # profiles, since it names this service explicitly) - this container
  # isn't meant to run continuously, only on demand, e.g.
  # `docker compose run --rm certbot certonly --webroot -w
  # /var/www/certbot -d medlenshealth.com ...` for initial issuance, or
  # `docker compose run --rm certbot renew` for renewal - see
  # docs/deployment.md's HTTPS section for the full commands and the cron
  # entry that runs the second one automatically. Sharing the same two
  # named volumes `frontend` mounts (above) is the entire integration
  # between the two containers: certbot writes a certificate, `frontend`'s
  # nginx reads it from the same place, and nginx's own ACME-challenge
  # location block (frontend/nginx.conf) serves whatever certbot writes to
  # the webroot volume so Let's Encrypt's HTTP-01 validation can reach it.
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  medlens_postgres_data:
  # Issue #189: never a bind mount to a path in this repository - a real
  # certificate (and its private key) only ever lives in Docker's own
  # volume storage, never in a git-tracked directory. See docs/deployment.md.
  certbot_certs:
  certbot_www:
