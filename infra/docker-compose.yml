services:
  backend:
    build:
      context: ../backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # POSTGRES_PASSWORD is shared with the postgres service below - both
      # read the same variable so they can never drift out of sync.
      DATABASE_URL: postgresql://medlens_user:${POSTGRES_PASSWORD:-medlens_password}@postgres:5432/medlens_db
      # Settings.jwt_secret_key (app/core/config.py) is required with no
      # default. The placeholder below is fine for local development -
      # nothing here is a real secret, and every service is thrown away on
      # `docker compose down` - but a real deployment MUST override it with
      # a real secret via infra/.env (see infra/.env.example), never by
      # editing this file. See docs/deployment.md's "Environment Variables"
      # section.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-not-used-anywhere-real}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Settings.gemini_model (app/core/config.py) already defaults to
      # gemini-2.5-flash when this is unset, so the default below is
      # redundant with that - kept explicit anyway so a Gemini model
      # retirement (the incident this default was changed for) can be fixed
      # here, in infra/.env, without touching application code or rebuilding
      # any image - just a container restart.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # development (the default) auto-allows any localhost/127.0.0.1
      # origin for CORS in addition to CORS_ALLOWED_ORIGINS (see
      # app/main.py) - correct for local Docker use, but a real deployment
      # must set this to "production" and set CORS_ALLOWED_ORIGINS
      # explicitly, or the deployed frontend's origin will be rejected.
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Issue #61: reported as-is by GET /health - purely informational,
      # never used to gate any behavior.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # Issue #59: root logger level - see docs/deployment.md's "Structured
      # Application Logging" section.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Issue #58: defaults to local-filesystem storage (inside this
      # container - lost on every recreate, see infra/.env.example), zero
      # extra configuration needed. Settings' own startup validation
      # (app/core/config.py) fails the container immediately, with a clear
      # error, if STORAGE_BACKEND=s3 is set here without AWS_REGION and
      # S3_BUCKET_NAME also set - never a silent misconfiguration.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Left unset by default even when STORAGE_BACKEND=s3 - the
      # recommended production setup is an IAM role attached to the EC2
      # instance, which needs neither (see docs/deployment.md's Security
      # section). Only set for local testing against a real bucket.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    healthcheck:
      # GET /health always returns HTTP 200, even when the database is
      # unreachable (see docs/api.md) - a plain "did the request succeed"
      # check would report healthy the whole time the app is actually
      # broken. This reads the response body and checks the field the
      # endpoint itself defines as the real signal, the same way a human
      # debugging it would.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request as u; d=json.loads(u.urlopen('http://localhost:8000/health').read()); exit(0 if d.get('status')=='ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        # Baked into the built JS bundle at image build time (see
        # frontend/Dockerfile) - the browser, not this container, is what
        # actually calls the backend, so this must be a real, publicly
        # reachable URL for a deployment (e.g. http://<ec2-public-ip>:8000),
        # not backend's in-network service name. Rebuild the image (`docker
        # compose build frontend`) after changing this - restarting the
        # container alone has no effect, since it's already baked in.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: this image's nginx only listens on
      # IPv4 (0.0.0.0:80), but the container's /etc/hosts resolves
      # "localhost" to ::1 (IPv6) first, which wget then tries first and
      # gets connection-refused on - a real failure caught during
      # verification, not a hypothetical.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # No depends_on: backend (Issue #183). This container serves the
    # prebuilt static SPA over nginx and nothing else - there is no
    # reverse proxy (see docs/deployment.md's Deployment Architecture) and
    # VITE_API_BASE_URL is baked into the JS bundle at image build time,
    # not read at container start, so the browser calls the backend
    # directly and this container has no runtime dependency on backend
    # being up, healthy, or even present. Waiting for it here would only
    # slow down `docker compose up` for no functional reason.

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medlens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlens_password}
      POSTGRES_DB: medlens_db
    ports:
      # Bound to localhost only, unlike backend/frontend above - the
      # database has no reason to be reachable from outside the host at
      # all (nothing outside this compose file ever needs to reach it
      # directly), so it stays unreachable even if a security group is
      # ever misconfigured to allow it. Still reachable from the host
      # itself (e.g. `psql -h localhost`, or an SSH tunnel from a laptop)
      # for debugging. See docs/deployment.md's Security section.
      - "127.0.0.1:5432:5432"
    volumes:
      - medlens_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlens_user -d medlens_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      # On a fresh volume, postgres's own entrypoint runs initdb, then
      # briefly starts and stops the server once as part of that process
      # before starting it for real (standard postgres:16 image behavior)
      # - pg_isready fails (connection refused) during that window, which
      # is expected, not a real problem. Without start_period those
      # expected early failures count toward retries above like any other
      # failure; matches backend's/frontend's own start_period above.
      start_period: 10s

volumes:
  medlens_postgres_data:
